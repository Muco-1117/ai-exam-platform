server:
  # 8080 常被 Docker 等占用,统一使用 8081
  port: ${PORT:8081}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_exam}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

aiexam:
  jwt:
    # HS256 签名密钥(长度>=32字节),生产环境请更换
    secret: ${JWT_SECRET:dev-only-change-me-please-rotate}
    expire-hours: 24

services:
  judge-url: ${JUDGE_URL:http://127.0.0.1:8082}
  ai-url: ${AI_URL:http://127.0.0.1:8083}
  gateway-url: ${GATEWAY_URL:http://127.0.0.1:8080}
  token: ${SERVICE_TOKEN:test-service-token}
